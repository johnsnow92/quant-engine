name: OrcaCode Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write # clean/fallback PR comments
  statuses: write # publish the verdict on the reviewed PR commit

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_ref: ${{ steps.authorize.outputs.base_ref }}
    if: |
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'edited' || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/orcacode-review') ||
          startsWith(github.event.comment.body, '/orcacode review') ||
          startsWith(github.event.comment.body, '@orcacode-review') ||
          startsWith(github.event.comment.body, '@orcacode review')))
    steps:
      - name: Authorize before entering the review queue
        id: authorize
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, urllib.request
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          run_url = os.environ['ORCA_RUN_URL']

          def request(path, data=None):
              req = urllib.request.Request(api + path, data=None if data is None else json.dumps(data).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          manual = os.environ['GITHUB_EVENT_NAME'] == 'issue_comment'
          number = event['issue']['number'] if manual else event['pull_request']['number']
          actor = quote((event['comment'] if manual else event['pull_request'])['user']['login'], safe='')
          permission = request(f'/repos/{repo}/collaborators/{actor}/permission')['permission']
          if permission not in ('write', 'maintain', 'admin'):
              raise SystemExit('Reviews require repository write permission.')
          pr = request(f'/repos/{repo}/pulls/{number}')
          if pr['state'] != 'open':
              raise SystemExit('The pull request is no longer open.')
          sha = pr['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid PR head SHA.')
          if not manual and event['pull_request']['head']['sha'] != sha:
              raise SystemExit('This event was superseded by a newer PR head.')
          base_ref = pr['base']['ref']
          base_sha = pr['base']['sha']
          # This job has no concurrency lock and cannot publish a verdict.
          # Reject unauthorized requests before they can occupy a review queue.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'head_sha={sha}\nbase_ref={base_ref}\n')
          PY
  review:
    needs: authorize
    runs-on: ubuntu-latest
    concurrency:
      # Only authorized jobs enter a queue; unrelated commit verdicts run independently.
      group: ${{ github.workflow }}-${{ needs.authorize.outputs.head_sha }}-${{ needs.authorize.outputs.base_ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Authorize review and start PR commit verdict
        id: verdict
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          ORCA_AUTHORIZED_SHA: ${{ needs.authorize.outputs.head_sha }}
          ORCA_AUTHORIZED_BASE: ${{ needs.authorize.outputs.base_ref }}
          GH_TOKEN: ${{ github.token }}
          ORCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, urllib.request
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          run_url = os.environ['ORCA_RUN_URL']

          def request(path, data=None):
              req = urllib.request.Request(api + path, data=None if data is None else json.dumps(data).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          manual = os.environ['GITHUB_EVENT_NAME'] == 'issue_comment'
          number = event['issue']['number'] if manual else event['pull_request']['number']
          actor = quote((event['comment'] if manual else event['pull_request'])['user']['login'], safe='')
          permission = request(f'/repos/{repo}/collaborators/{actor}/permission')['permission']
          if permission not in ('write', 'maintain', 'admin'):
              raise SystemExit('Reviews require repository write permission.')
          pr = request(f'/repos/{repo}/pulls/{number}')
          if pr['state'] != 'open':
              raise SystemExit('The pull request is no longer open.')
          sha = pr['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid PR head SHA.')
          if not manual and event['pull_request']['head']['sha'] != sha:
              raise SystemExit('This event was superseded by a newer PR head.')
          base_ref = pr['base']['ref']
          base_sha = request(f'/repos/{repo}/git/ref/heads/{quote(base_ref, safe="")}')['object']['sha']
          if (sha, base_ref) != (os.environ['ORCA_AUTHORIZED_SHA'], os.environ['ORCA_AUTHORIZED_BASE']):
              raise SystemExit('PR head or target changed while waiting for its review lock.')
          status_context = 'OrcaCode verdict: ' + base_ref
          status = {'context': status_context, 'target_url': run_url}
          if base_ref != request(f'/repos/{repo}')['default_branch']:
              request(f'/repos/{repo}/statuses/{sha}', dict(status, state='error', description='Review is unsupported for this target branch.'))
              raise SystemExit('This integration reviews only the repository default branch.')
          if not re.fullmatch(r'[0-9a-f]{40}', base_sha):
              raise SystemExit('Invalid PR base SHA.')
          if not manual and event['pull_request']['base']['ref'] != base_ref:
              raise SystemExit('This event was superseded by a different PR base.')
          # The pinned vendor checkout is only validated for branches in this repository.
          if not pr['head']['repo'] or pr['head']['repo']['full_name'] != repo:
              request(f'/repos/{repo}/statuses/{sha}', dict(status, state='error', description='Fork review is unsupported by this pinned integration.'))
              raise SystemExit('Fork reviews require a separately validated vendor checkout path.')
          request(f'/repos/{repo}/statuses/{sha}', dict(status, state='pending', description='Orca review is running for this commit.'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'head_sha={sha}\nbase_ref={base_ref}\nbase_sha={base_sha}\npr_number={number}\nstatus_context={status_context}\n')
          PY
      - name: Validate dashboard settings without fallback
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          cat > "$RUNNER_TEMP/orca-settings-guard.mjs" <<'JS'
          // Loaded only for the pinned vendor action. Reject settings fallback before review.
          import fs from 'node:fs';
          const fetchOriginal = globalThis.fetch;
          const fail = () => {
            console.error('Orca review requires valid exhaustive dashboard settings; refusing fallback.');
            process.exit(1);
          };
          const severitySet = (value) => typeof value === 'string'
            ? [...new Set(value.split(',').map(x => x.trim().toUpperCase()).filter(Boolean))].sort().join(',')
            : null;
          globalThis.fetch = async (input, options) => {
            const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url);
            if (url.origin !== 'https://api.orcarouter.ai' || url.pathname !== '/api/code_review/settings') {
              return fetchOriginal(input, options);
            }
            try {
              if (url.searchParams.get('repo') !== process.env.ORCA_REVIEW_REPOSITORY) return fail();
              const response = await fetchOriginal(input, options);
              if (!response.ok) return fail();
              const body = await response.clone().json();
              const data = body?.data;
              if (body?.success !== true || !data || data.auto_review !== true ||
                  data.trigger !== 'every_push' || data.exhaustive !== true || data.quiet !== false ||
                  severitySet(data.fix_first) === null || !/^([P][0-3](,[P][0-3])*)?$/.test(severitySet(data.fix_first)) || severitySet(data.block_on) !== 'P0,P1' ||
                  severitySet(data.report_on) !== 'P0,P1,P2,P3' || typeof data.rubric !== 'string') return fail();
              fs.writeFileSync(process.env.ORCA_SETTINGS_RECEIPT,
                JSON.stringify({repository: process.env.ORCA_REVIEW_REPOSITORY, validated: true}), {mode: 0o600});
              return response;
            } catch {
              return fail();
            }
          };
          JS
      - id: orca
        uses: Continuum-AI-Corp/orca-code-review@6d253e0399c84848fedc8801176d6bea77817762 # v1.6.0
        env:
          NODE_OPTIONS: --import=${{ runner.temp }}/orca-settings-guard.mjs
          ORCA_REVIEW_REPOSITORY: ${{ github.repository }}
          ORCA_SETTINGS_RECEIPT: ${{ runner.temp }}/orca-settings-${{ github.run_id }}-${{ github.run_attempt }}.json
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
          settings: "true"
          fix-first: "" # exhaustive passes must not stop after an early finding
          block-on: "P1,P0" # explicit non-default ordering enforces P0/P1 regardless of dashboard
          on-oversized-diff: "fail"
          auto-review-authors: "" # repository write permission is checked before this step
      - name: Publish PR commit verdict
        if: always() && steps.verdict.outputs.head_sha != ''
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          ORCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ORCA_HEAD_SHA: ${{ steps.verdict.outputs.head_sha }}
          ORCA_STATUS_CONTEXT: ${{ steps.verdict.outputs.status_context }}
          ORCA_BASE_REF: ${{ steps.verdict.outputs.base_ref }}
          ORCA_BASE_SHA: ${{ steps.verdict.outputs.base_sha }}
          ORCA_PR_NUMBER: ${{ steps.verdict.outputs.pr_number }}
          ORCA_SETTINGS_RECEIPT: ${{ runner.temp }}/orca-settings-${{ github.run_id }}-${{ github.run_attempt }}.json
          ORCA_OUTCOME: ${{ steps.orca.outcome }}
        run: |
          python3 -I - <<'PY'
          import json, os, subprocess, urllib.request
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          sha = os.environ['ORCA_HEAD_SHA']
          run_url = os.environ['ORCA_RUN_URL']
          status_context = os.environ['ORCA_STATUS_CONTEXT']

          def request(path, data=None):
              req = urllib.request.Request(api + path, data=None if data is None else json.dumps(data).encode(), headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          # A superseded run must never overwrite the status owned by a newer run.
          page = 1
          latest = None
          while latest is None:
              statuses = request(f'/repos/{repo}/commits/{sha}/statuses?per_page=100&page={page}')
              latest = next((s for s in statuses if s['context'] == status_context), None)
              if len(statuses) < 100:
                  break
              page += 1
          if not latest or latest['target_url'] != run_url:
              raise SystemExit('This run no longer owns the verdict status.')
          state = 'failure'
          description = 'Review failed, was cancelled, or found blocking issues.'
          if os.environ['ORCA_OUTCOME'] == 'success':
              try:
                  with open(os.environ['ORCA_SETTINGS_RECEIPT']) as source:
                      receipt = json.load(source)
              except (OSError, ValueError):
                  receipt = None
              if receipt != {'repository': repo, 'validated': True}:
                  state = 'error'
                  description = 'Dashboard settings validation receipt is missing or invalid.'
              else:
                  # The composite resolves refs internally. Verify what it actually checked out,
                  # catching a head change between our preflight and its issue-comment lookup.
                  result = subprocess.run(['git', '-C', os.environ['GITHUB_WORKSPACE'], 'rev-parse', 'HEAD'], capture_output=True, text=True)
                  base_ref = os.environ['ORCA_BASE_REF']
                  base_sha = os.environ['ORCA_BASE_SHA']
                  base = subprocess.run(['git', '-C', os.environ['GITHUB_WORKSPACE'], 'rev-parse', 'refs/remotes/origin/' + base_ref], capture_output=True, text=True)
                  pr = request(f"/repos/{repo}/pulls/{os.environ['ORCA_PR_NUMBER']}")
                  current_default = request(f'/repos/{repo}')['default_branch']
                  current_base = request(f'/repos/{repo}/git/ref/heads/{quote(base_ref, safe="")}')['object']['sha']
                  unchanged = pr['state'] == 'open' and pr['head']['sha'] == sha and pr['base']['ref'] == base_ref == current_default and current_base == base_sha
                  if unchanged and result.returncode == 0 and result.stdout.strip() == sha and base.returncode == 0 and base.stdout.strip() == base_sha:
                      state = 'success'
                      description = 'Review completed; no configured blocking findings.'
                  else:
                      state = 'error'
                      description = 'The reviewed base/head changed or checkout was skipped.'
          request(f'/repos/{repo}/statuses/{sha}', {'context': status_context, 'target_url': run_url, 'state': state, 'description': description})
          if state != 'success':
              raise SystemExit(description)
          PY
