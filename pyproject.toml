[project]
name = "quant-engine"
version = "0.1.0"
description = "Crypto/derivatives quant engine: market data, backtesting, paper execution with pre-trade guards"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
